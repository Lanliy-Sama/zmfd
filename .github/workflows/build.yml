name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "src/**"
      - "static/**"
      - "Cargo.toml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: agentmore2api-linux-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: agentmore2api-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Cranelift codegen backend
        run: rustup component add rustc-codegen-cranelift-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release (Cranelift backend, opt-level Speed)
        env:
          RUSTFLAGS: "-Zcodegen-backend=cranelift"
        run: cargo build --release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg
          cp target/release/agentmore2api pkg/
          cp README.md pkg/ 2>/dev/null || true
          tar -czf ${{ matrix.archive }} -C pkg .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item target/release/agentmore2api.exe pkg/
          if (Test-Path README.md) { Copy-Item README.md pkg/ }
          Compress-Archive -Path pkg/* -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          retention-days: 30

  release:
    name: release
    needs: build
    # 触发方式：提交信息带 [release] 标记，或推送 v* 标签。
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('auto-{0}', github.run_number) }}
          body: |
            agentmore2api 自动构建产物（Cranelift 后端，opt-level Speed）。
            - linux: agentmore2api-linux-x64.tar.gz
            - windows: agentmore2api-windows-x64.zip
          generate_release_notes: true
